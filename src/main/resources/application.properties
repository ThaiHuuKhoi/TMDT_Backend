spring.application.name=TMDT
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Security/cookie defaults shared across profiles
application.security.cookies.refresh.same-site=${APP_SECURITY_REFRESH_COOKIE_SAME_SITE:Lax}
application.security.cookies.secure=${APP_SECURITY_COOKIES_SECURE:true}
application.security.trust-forward-headers=${APP_SECURITY_TRUST_FORWARD_HEADERS:false}
application.frontend.url=${APP_FRONTEND_URL:http://localhost:3002}
application.frontend.oauth2.redirect-uri=${APP_FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:3002/oauth2/redirect}
application.security.oauth2.authorized-redirect-uris=${APP_SECURITY_OAUTH2_AUTHORIZED_REDIRECT_URIS:http://localhost:3002/oauth2/redirect}
application.security.registration-otp.expiration-minutes=${APP_SECURITY_REGISTRATION_OTP_EXPIRATION_MINUTES:10}
application.security.registration.rate-limit.email-per-hour=${APP_SECURITY_REGISTRATION_RL_EMAIL_PER_HOUR:5}
application.security.registration.rate-limit.ip-per-hour=${APP_SECURITY_REGISTRATION_RL_IP_PER_HOUR:30}
application.security.registration.rate-limit.verify-ip-per-hour=${APP_SECURITY_REGISTRATION_RL_VERIFY_IP_PER_HOUR:80}
application.security.password-reset.rate-limit.email-per-hour=${APP_SECURITY_PASSWORD_RESET_RL_EMAIL_PER_HOUR:5}
application.security.password-reset.rate-limit.ip-per-hour=${APP_SECURITY_PASSWORD_RESET_RL_IP_PER_HOUR:20}
application.security.password-reset.rate-limit.reset-ip-per-hour=${APP_SECURITY_PASSWORD_RESET_RL_RESET_IP_PER_HOUR:40}
application.security.registration.otp.max-failed-attempts=${APP_SECURITY_REGISTRATION_OTP_MAX_FAILS:5}
application.security.registration.otp.failed-window-minutes=${APP_SECURITY_REGISTRATION_OTP_FAIL_WINDOW_MINUTES:15}

application.chatbot.rate-limit.ip-per-minute=${APP_CHATBOT_RL_IP_PER_MIN:30}
application.chatbot.rate-limit.user-per-minute=${APP_CHATBOT_RL_USER_PER_MIN:60}

# Phí ship: mức cố định khi không dùng API đối tác; khối lượng ước tính = itemCount × grams-per-item-unit.
application.shipping.default-fee-vnd=${APP_SHIPPING_DEFAULT_FEE_VND:20000}
application.shipping.grams-per-item-unit=${APP_SHIPPING_GRAMS_PER_UNIT:500}