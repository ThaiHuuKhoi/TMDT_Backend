server.port=${PORT:${SERVER_PORT:8080}}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.mail.enabled=false
application.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3002,http://localhost:3003}
application.security.cookies.secure=${APP_SECURITY_COOKIES_SECURE:true}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.security.oauth2.client.registration.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.client-id=${OAUTH_FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${OAUTH_FACEBOOK_CLIENT_SECRET:}


spring.cache.type=redis
spring.data.redis.url=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:}

ghn.api.url=${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
ghn.api.token=${GHN_API_TOKEN:}
ghn.shop.id=${GHN_SHOP_ID:}
ghn.from.district-id=${GHN_FROM_DISTRICT_ID:}
ghn.from.ward-code=${GHN_FROM_WARD_CODE:}
ghn.service-type-id=${GHN_SERVICE_TYPE_ID:2}

ghtk.api.token=${GHTK_API_TOKEN:}

app.facebook.page-id=${FACEBOOK_PAGE_ID:}
app.facebook.page-access-token=${FACEBOOK_PAGE_ACCESS_TOKEN:}
app.facebook.graph-version=${FACEBOOK_GRAPH_VERSION:v21.0}
