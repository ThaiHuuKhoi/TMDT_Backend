<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
    <div style="background-color: #000; color: #fff; padding: 20px; text-align: center;">
        <h2 style="margin: 0;">Xác minh đăng ký tài khoản</h2>
    </div>
    <div style="padding: 20px;">
        <p>Xin chào <strong th:text="${name}">bạn</strong>,</p>
        <p>Mã OTP xác minh đăng ký tài khoản của bạn là:</p>
        <div style="text-align: center; margin: 24px 0;">
            <span th:text="${otpCode}" style="font-size: 32px; font-weight: bold; letter-spacing: 8px; background-color: #f9f9f9; padding: 12px 24px; border-radius: 8px; border: 1px solid #ddd;">000000</span>
        </div>
        <p style="color: #888; font-size: 13px;">Mã có hiệu lực trong 10 phút. Không chia sẻ mã này với bất kỳ ai.</p>
    </div>
    <div style="background-color: #f1f1f1; padding: 10px; text-align: center; font-size: 12px; color: #666;">
        &copy; 2026 ShopKCG. All rights reserved.
    </div>
</div>
</body>
</html>
